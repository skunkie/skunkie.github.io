name: Build and Deploy Docs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Never run two deployments at once; let an in-progress deployment finish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Check Markdown formatting
        run: npx --yes prettier@3.9.9 --check "**/*.md"

      - name: Check language symmetry
        shell: bash
        run: |
          diff <(cd content/en && find . -type f | sort) <(cd content/ru && find . -type f | sort)

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: Build
        env:
          HUGO_PARAMS_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          hugo --minify --gc \
            --baseURL "https://${{ github.repository_owner }}.github.io/"

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
